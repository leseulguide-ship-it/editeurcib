name: Publier EditeurCiB sur le web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Seuls les fichiers de l'application sont publiés (pas le projet Android ni la documentation).
      - name: Rassembler les fichiers du site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js fonts img lib _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
