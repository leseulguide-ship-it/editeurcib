name: Construire l’APK EditeurCiB

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci

      - name: Copier l’application dans le projet Android
        run: npm run sync

      - name: Vérifier la clé de signature
        env:
          KS: ${{ secrets.CIB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Le secret CIB_KEYSTORE_BASE64 est absent. Ajoutez les 4 secrets de la clé CiB dans Settings > Secrets and variables > Actions (voir CLAUDE.md)."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/cle-cib.jks"

      - name: Construire l’APK signé
        working-directory: android
        env:
          CIB_KEYSTORE_PATH: ${{ runner.temp }}/cle-cib.jks
          CIB_KEYSTORE_PASSWORD: ${{ secrets.CIB_KEYSTORE_PASSWORD }}
          CIB_KEY_ALIAS: ${{ secrets.CIB_KEY_ALIAS }}
          CIB_KEY_PASSWORD: ${{ secrets.CIB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/EditeurCiB.apk

      - uses: actions/upload-artifact@v5
        with:
          name: EditeurCiB-apk
          path: android/app/build/outputs/apk/release/EditeurCiB.apk

      - name: Publier dans la page « Releases » (versions taguées)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/EditeurCiB.apk
